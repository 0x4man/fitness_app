name: fitness_app
description: A Flutter workout tracker app with Firebase authentication.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Firebase
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.4
  cloud_firestore: ^4.15.5

  # State management
  provider: ^6.1.2

  # UI / UX helpers
  google_fonts: ^6.2.1
  smooth_page_indicator: ^1.1.0
  fl_chart: ^0.68.0

  # Local storage
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  